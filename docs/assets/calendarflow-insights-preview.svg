<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CalendarFlow deadline insights preview</title>
  <desc id="desc">A sample insights dashboard showing due-date counts and monthly deadline density from synthetic board cards.</desc>
  <rect width="1440" height="900" rx="24" fill="#f6f7f5"/>
  <rect x="0" y="0" width="1440" height="76" rx="24" fill="#fff"/><path d="M0 52h1440v24H0z" fill="#fff"/><path d="M0 76h1440" stroke="#e3e9e7"/>
  <rect x="38" y="21" width="34" height="34" rx="10" fill="#183747"/><path d="M47 31h16v14H47zM51 27v8m8-8v8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="85" y="46" fill="#183747" font-family="Arial,sans-serif" font-size="24" font-weight="700">Calendar<tspan fill="#1f786f">Flow</tspan></text>
  <text x="290" y="44" fill="#73838b" font-family="Arial,sans-serif" font-size="15">Example board · synthetic cards</text>
  <rect x="50" y="112" width="795" height="48" rx="11" fill="#e9efed"/>
  <text x="109" y="142" text-anchor="middle" fill="#708088" font-family="Arial,sans-serif" font-size="15">Month</text><text x="221" y="142" text-anchor="middle" fill="#708088" font-family="Arial,sans-serif" font-size="15">Week</text><text x="331" y="142" text-anchor="middle" fill="#708088" font-family="Arial,sans-serif" font-size="15">Year</text>
  <rect x="401" y="116" width="112" height="40" rx="8" fill="#fff"/><text x="457" y="142" text-anchor="middle" fill="#183747" font-family="Arial,sans-serif" font-size="15" font-weight="700">Insights</text><text x="590" y="142" text-anchor="middle" fill="#708088" font-family="Arial,sans-serif" font-size="15">Resources</text>
  <text x="50" y="224" fill="#183747" font-family="Arial,sans-serif" font-size="32" font-weight="700">Deadline insights</text>
  <text x="50" y="254" fill="#73838b" font-family="Arial,sans-serif" font-size="15">A count of dates on the current board—not an estimate of effort.</text>
  <g font-family="Arial,sans-serif">
    <rect x="50" y="282" width="425" height="146" rx="14" fill="#fff" stroke="#e3e9e7"/><text x="76" y="318" fill="#73838b" font-size="14">Cards with due dates</text><text x="76" y="382" fill="#183747" font-size="46" font-weight="700">3</text><text x="132" y="382" fill="#73838b" font-size="14">visible cards</text>
    <rect x="507" y="282" width="425" height="146" rx="14" fill="#fff" stroke="#e3e9e7"/><text x="533" y="318" fill="#73838b" font-size="14">Completed</text><text x="533" y="382" fill="#37734c" font-size="46" font-weight="700">1</text><text x="571" y="382" fill="#73838b" font-size="14">dated card</text>
    <rect x="964" y="282" width="426" height="146" rx="14" fill="#fff" stroke="#e3e9e7"/><text x="990" y="318" fill="#73838b" font-size="14">Overdue · incomplete</text><text x="990" y="382" fill="#b44c43" font-size="46" font-weight="700">1</text><text x="1028" y="382" fill="#73838b" font-size="14">past due</text>
    <rect x="50" y="448" width="425" height="146" rx="14" fill="#fff" stroke="#e3e9e7"/><text x="76" y="484" fill="#73838b" font-size="14">Upcoming · incomplete</text><text x="76" y="548" fill="#1f786f" font-size="46" font-weight="700">1</text><text x="114" y="548" fill="#73838b" font-size="14">today or later</text>
    <rect x="507" y="448" width="425" height="146" rx="14" fill="#fff" stroke="#e3e9e7"/><text x="533" y="484" fill="#73838b" font-size="14">Without a due date</text><text x="533" y="548" fill="#526972" font-size="46" font-weight="700">1</text><text x="571" y="548" fill="#73838b" font-size="14">visible card</text>
  </g>
  <rect x="50" y="620" width="1340" height="216" rx="14" fill="#fff" stroke="#e3e9e7"/>
  <text x="78" y="662" fill="#183747" font-family="Arial,sans-serif" font-size="20" font-weight="700">Monthly deadline density</text>
  <text x="78" y="687" fill="#73838b" font-family="Arial,sans-serif" font-size="13">Darker cells have more due dates; this does not represent task effort.</text>
  <g font-family="Arial,sans-serif" font-size="12" text-anchor="middle">
    <g fill="#6f8085"><text x="103" y="730">1</text><text x="160" y="730">2</text><text x="217" y="730">3</text><text x="274" y="730">4</text><text x="331" y="730">5</text><text x="388" y="730">6</text><text x="445" y="730">7</text><text x="502" y="730">8</text><text x="559" y="730">9</text><text x="616" y="730">10</text><text x="673" y="730">11</text><text x="730" y="730">12</text><text x="787" y="730">13</text><text x="844" y="730">14</text><text x="901" y="730">15</text><text x="958" y="730">16</text><text x="1015" y="730">17</text><text x="1072" y="730">18</text><text x="1129" y="730">19</text><text x="1186" y="730">20</text><text x="1243" y="730">21</text><text x="1300" y="730">22</text><text x="1357" y="730">23</text></g>
    <rect x="78" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="135" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="192" y="745" width="50" height="46" rx="7" fill="#cfe4dd"/><rect x="249" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="306" y="745" width="50" height="46" rx="7" fill="#9ecbbd"/><rect x="363" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="420" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="477" y="745" width="50" height="46" rx="7" fill="#cfe4dd"/><rect x="534" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="591" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="648" y="745" width="50" height="46" rx="7" fill="#9ecbbd"/><rect x="705" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="762" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="819" y="745" width="50" height="46" rx="7" fill="#cfe4dd"/><rect x="876" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="933" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="990" y="745" width="50" height="46" rx="7" fill="#9ecbbd"/><rect x="1047" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="1104" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="1161" y="745" width="50" height="46" rx="7" fill="#cfe4dd"/><rect x="1218" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="1275" y="745" width="50" height="46" rx="7" fill="#edf4f1"/><rect x="1332" y="745" width="44" height="46" rx="7" fill="#edf4f1"/>
  </g>
  <text x="50" y="870" fill="#73838b" font-family="Arial,sans-serif" font-size="13">Illustrative preview · counts use synthetic sample cards</text>
  <text x="1390" y="870" text-anchor="end" fill="#73838b" font-family="Arial,sans-serif" font-size="13">No effort or productivity score is inferred</text>
</svg>
